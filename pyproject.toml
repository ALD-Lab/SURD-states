[project]
name = "surd-states"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alvaro Martinez Sanchez", email = "alvaroms@mit.edu" },
    { name = "Enrico Foglia", email = "enricofoglia99@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-image>=0.20",
    "scikit-learn>=1.3",
    "pymp-pypi>=0.5",
]

[project.optional-dependencies]
examples = [
    "marimo>=0.20.2",
]
docs = [
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]
